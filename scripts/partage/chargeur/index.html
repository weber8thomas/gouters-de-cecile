<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a2e1f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Le carnet</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<style>
  @font-face { font-family: "Caveat"; font-weight: 400 700; font-display: swap; src: url("./police.woff2") format("woff2"); }
  :root { --papier: #f4ebda; --papier-bord: #e7d6b8; --encre: #4a2e1f; --encre-douce: #7a5a46; --rouge: #9a3b2a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--encre); color: var(--encre); }
  body {
    display: grid; place-items: center; min-height: 100vh; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    font-family: "Caveat", "Bradley Hand", "Segoe Print", cursive; font-size: 22px; line-height: 1.3;
    background: radial-gradient(ellipse at 50% 30%, #5d3b28, var(--encre) 70%);
  }
  main {
    width: min(100%, 440px); padding: 34px 30px 26px; border-radius: 3px;
    background:
      linear-gradient(to right, transparent 46px, rgba(154, 59, 42, .22) 46px 47px, transparent 47px),
      repeating-linear-gradient(to bottom, transparent 0 31px, rgba(74, 46, 31, .12) 31px 32px),
      var(--papier);
    box-shadow: 0 1px 0 var(--papier-bord), 0 14px 34px rgba(0, 0, 0, .45);
    transform: rotate(-.4deg);
  }
  h1 { margin: 0 0 6px 28px; font-size: 52px; line-height: 1; font-weight: 700; }
  p.mot { margin: 0 0 18px 28px; color: var(--encre-douce); }
  form { margin-left: 28px; }
  label.champ { display: block; }
  .rangee { display: flex; gap: 8px; align-items: end; }
  input[type=password], input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 26px; color: var(--encre);
    background: transparent; border: 0; border-bottom: 2px solid var(--encre); padding: 6px 2px; border-radius: 0; outline-offset: 4px;
  }
  button { font: inherit; cursor: pointer; }
  button.voir { background: none; border: 0; color: var(--encre-douce); text-decoration: underline; padding: 4px 2px; }
  .souvenir { display: flex; gap: 10px; align-items: center; margin: 16px 0 18px; cursor: pointer; }
  .souvenir input { width: 22px; height: 22px; accent-color: var(--encre); }
  button.ouvrir {
    width: 100%; padding: 10px 16px; font-size: 28px; font-weight: 700; color: var(--papier);
    background: var(--encre); border: 0; border-radius: 3px; box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }
  button.ouvrir:hover:not(:disabled) { background: #623d29; }
  button.ouvrir:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 2px solid var(--encre-douce); }
  #message { min-height: 2.6em; margin: 12px 0 0; color: var(--rouge); }
  #message.ok { color: var(--encre-douce); }
  .pied { margin: 6px 0 0 28px; font-size: 18px; }
  .pied a { color: var(--encre-douce); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Le carnet</h1>
  <p class="mot">Entre la phrase de passe pour l'ouvrir.</p>
  <form id="forme" autocomplete="off">
    <label class="champ" for="mdp">Phrase de passe</label>
    <div class="rangee">
      <input id="mdp" name="mdp" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <button type="button" class="voir" id="voir" aria-pressed="false">voir</button>
    </div>
    <label class="souvenir"><input type="checkbox" id="souvenir"> Se souvenir sur cet appareil</label>
    <button type="submit" class="ouvrir" id="ouvrir">Ouvrir le carnet</button>
    <p id="message" role="status" aria-live="polite"></p>
  </form>
  <p class="pied"><a href="./?oublier" id="oublier">Oublier ce carnet sur cet appareil</a></p>
</main>
<script src="./ouvrir.js"></script>
</body>
</html>
