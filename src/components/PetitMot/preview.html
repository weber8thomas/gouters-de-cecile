<!-- @dsCard group="Typographie & recette" height=320 -->
<div id="root"></div>
<script>
  (function () {
    var h = React.createElement;
    var G = GoutersDeCecile;
    var julie = G.getGuest('julie');

    // Une bande de papier par encre, à la largeur réelle d'une zone de texte (760 px au plus).
    function Band(ink) {
      return h('div', {
        style: {
          boxSizing: 'border-box',
          display: 'flex',
          flexDirection: 'column',
          justifyContent: 'center',
          padding: '0 var(--gc-space-6)',
          background: 'var(--gc-paper)'
        }
      }, h('div', { style: { width: '100%', maxWidth: 'calc(var(--gc-page-w) - var(--gc-page-pad-outer) - var(--gc-page-pad-spine))', margin: '0 auto' } },
        h(G.PetitMot, { note: julie.note, signature: julie.signature, ink: ink })));
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      h('div', { style: { display: 'grid', gridTemplateRows: '1fr 1fr', rowGap: '2px', height: '320px', background: 'var(--gc-paper-edge)' } },
        Band('night'),
        Band('chocolat')));
  })();
</script>
