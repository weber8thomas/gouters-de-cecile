<!-- @dsCard group="Écrins" width=1600 height=900 -->
<div id="root" style="box-sizing:border-box;width:100%;min-height:900px;padding:var(--gc-space-4) var(--gc-space-6) 0;background:var(--gc-paper);color:var(--gc-chocolate)"></div>
<script>
  (function () {
    var h = React.createElement;
    var G = GoutersDeCecile;
    var line = { stroke: 'var(--gc-ink)', strokeWidth: 0.7, strokeLinecap: 'round', strokeLinejoin: 'round' };
    function paint(fill, extra) { return { style: Object.assign({ fill: fill }, line, extra || {}) }; }
    function flat(fill, extra) { return { style: Object.assign({ fill: fill }, extra || {}) }; }
    function shape(tag, attrs, style) { return h(tag, Object.assign({}, attrs, style)); }

    // Média de démonstration : petite scène 16:9 (une invitée attablée, une fenêtre, une tasse, une part de gâteau).
    function DemoScene(props) {
      var stripes = [];
      for (var x = 4; x < 160; x += 12) stripes.push(shape('rect', { key: x, x: x, y: 0, width: 4, height: 68 }, flat('var(--gc-terracotta-100)')));
      return h('svg', { viewBox: '0 0 160 90', preserveAspectRatio: 'xMidYMid slice', className: props.className, 'aria-hidden': 'true' },
        shape('rect', { width: 160, height: 90 }, flat('var(--gc-pink-100)')),
        stripes,
        shape('circle', { cx: 52, cy: 22, r: 30 }, flat('var(--gc-glow)', { opacity: 0.35 })),
        shape('rect', { x: 38, y: 7, width: 34, height: 42, rx: 1.5 }, paint('var(--gc-sage-500)')),
        shape('rect', { x: 41, y: 10, width: 28, height: 36 }, flat('var(--gc-honey-100)')),
        shape('path', { d: 'M41 46V34c5-6 9-2 13-6s10-3 15 2v16Z' }, flat('var(--gc-sage-300)')),
        shape('rect', { x: 54, y: 10, width: 2, height: 36 }, flat('var(--gc-sage-500)')),
        shape('rect', { x: 41, y: 27, width: 28, height: 2 }, flat('var(--gc-sage-500)')),
        shape('path', { d: 'M35 5c4 0 7 1 9 2c-1 14 1 30 -3 44c-2 1-5 1-7 0c2-15 1-31 1-46Z' }, paint('var(--gc-terracotta-300)')),
        shape('rect', { x: 0, y: 66, width: 160, height: 24 }, flat('var(--gc-linen)')),
        shape('path', { d: 'M0 66.5H160' }, paint('none')),
        shape('path', { d: 'M0 70H160M0 74H160' }, paint('none', { stroke: 'var(--gc-terracotta-300)', strokeWidth: 1.4 })),
        // part de gâteau sur son assiette
        shape('ellipse', { cx: 54, cy: 70, rx: 12, ry: 2.6 }, paint('var(--gc-porcelain)')),
        shape('path', { d: 'M45 69L63 69L61 60L47 62Z' }, paint('var(--gc-crumb)')),
        shape('path', { d: 'M46.4 65.6L62.2 65.2' }, paint('none', { stroke: 'var(--gc-jam)', strokeWidth: 1.4 })),
        shape('path', { d: 'M47 62L61 60L60.4 58.6L47.4 60.6Z' }, paint('var(--gc-crust)')),
        // l'invitée (cheveux carrés, haut terracotta)
        shape('path', { d: 'M73 34C71 19 101 19 99 34L100 48C95 50 77 50 72 48Z' }, paint('var(--gc-hair-2)')),
        shape('rect', { x: 82, y: 44, width: 8, height: 12 }, paint('var(--gc-skin-2)')),
        shape('path', { d: 'M61 91C61 70 70 58 86 56C102 58 111 70 111 91Z' }, paint('var(--gc-terracotta-300)')),
        shape('path', { d: 'M80.5 56.5L86 63L91.5 56.5Z' }, paint('var(--gc-skin-2)')),
        shape('ellipse', { cx: 86, cy: 35, rx: 12, ry: 13.5 }, paint('var(--gc-skin-2)')),
        shape('path', { d: 'M73.5 33C74 22 98 21 98.5 33C93 28 83 27 73.5 33Z' }, paint('var(--gc-hair-2)')),
        shape('path', { d: 'M74 31C72 39 73 45 76 48L79 47C77 41 77 35 78 31Z' }, paint('var(--gc-hair-2)')),
        shape('path', { d: 'M98 31C100 39 99 45 96 48L93 47C95 41 95 35 94 31Z' }, paint('var(--gc-hair-2)')),
        shape('circle', { cx: 79.6, cy: 40, r: 2.2 }, flat('var(--gc-pink-300)')),
        shape('circle', { cx: 92.4, cy: 40, r: 2.2 }, flat('var(--gc-pink-300)')),
        shape('ellipse', { cx: 81.6, cy: 36, rx: 1.1, ry: 1.3 }, flat('var(--gc-ink)')),
        shape('ellipse', { cx: 90.4, cy: 36, rx: 1.1, ry: 1.3 }, flat('var(--gc-ink)')),
        shape('path', { d: 'M82.6 41.4Q86 44.6 89.4 41.4' }, paint('none', { strokeWidth: 0.9 })),
        shape('ellipse', { cx: 75, cy: 69, rx: 5, ry: 2.8 }, paint('var(--gc-skin-2)')),
        shape('ellipse', { cx: 97, cy: 69, rx: 5, ry: 2.8 }, paint('var(--gc-skin-2)')),
        // tasse de thé
        shape('ellipse', { cx: 113, cy: 70.5, rx: 10, ry: 2.2 }, paint('var(--gc-porcelain)')),
        shape('path', { d: 'M119.5 63c3 0 3.5 4 0 4.6' }, paint('none', { strokeWidth: 1.1 })),
        shape('path', { d: 'M106 61.5H120C120 67 117 70 113 70C109 70 106 67 106 61.5Z' }, paint('var(--gc-porcelain)')),
        shape('ellipse', { cx: 113, cy: 61.6, rx: 6.2, ry: 1.4 }, flat('var(--gc-tea)')),
        shape('path', { d: 'M110.5 58c-1.4-1.6 1.2-2.6 0-4.4M115 57.6c-1.4-1.6 1.2-2.6 0-4.4' }, paint('none', { strokeWidth: 0.6, opacity: 0.55 })));
    }

    // L'enfant du slot gère ses deux rendus : figé (traité) et en couleur, plus le voile de papier.
    function DemoMedia() {
      return h('div', null,
        h(DemoScene, { className: 'gc-ecrin__live' }),
        h(DemoScene, { className: 'gc-ecrin__still' }),
        h('div', { className: 'gc-ecrin__wash' }));
    }

    function column(label, props) {
      return h('figure', { style: { margin: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 'var(--gc-space-2)' } },
        h('figcaption', { className: 'gc-hand-meta' }, label),
        h(G.Ecrin, Object.assign({ type: 'cloche', variant: 'a', media: h(DemoMedia), caption: 'Julie, depuis Lyon', liquid: 'the', style: { width: '640px' } }, props)));
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      h('div', { style: { display: 'flex', justifyContent: 'center', gap: 'var(--gc-space-9)' } },
        column('Avant lecture', { state: 'idle', progress: 0 }),
        column('En lecture', { state: 'playing', progress: 0.6 })));
  })();
</script>
