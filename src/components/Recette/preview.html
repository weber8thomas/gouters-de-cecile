<!-- @dsCard group="Typographie & recette" width=896 height=1000 -->
<div id="root"></div>
<script>
  (function () {
    var h = React.createElement;
    var G = GoutersDeCecile;
    var julie = G.getGuest('julie');
    // Une page du livre ouvert : 896 × 1000, zone de texte 760 × 888 (marges des tokens).
    ReactDOM.createRoot(document.getElementById('root')).render(
      h('section', {
        style: {
          boxSizing: 'border-box',
          width: 'var(--gc-page-w)',
          height: 'var(--gc-page-h)',
          padding: 'var(--gc-page-pad-top) var(--gc-page-pad-outer) var(--gc-page-pad-bottom) var(--gc-page-pad-spine)',
          display: 'flex',
          flexDirection: 'column',
          background:
            'linear-gradient(to right, color-mix(in srgb, var(--gc-paper-edge) 85%, transparent), transparent var(--gc-gutter-shadow)),' +
            'radial-gradient(120% 90% at 0% 0%, var(--gc-paper-lit), var(--gc-paper) 60%)'
        }
      },
        h(G.Recette, { recipe: julie.recipe }),
        h('div', { style: { marginTop: 'auto' } },
          h(G.PetitMot, { note: julie.note, signature: julie.signature, ink: julie.ink }))));
  })();
</script>
