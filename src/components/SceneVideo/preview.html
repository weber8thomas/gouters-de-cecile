<!-- @dsCard group="Illustrations" width=1980 height=420 -->
<div id="root"></div>
<script>
  (function () {
    var h = React.createElement;
    var SceneVideo = GoutersDeCecile.SceneVideo;
    // Cadrage rond : disque centré sur le point focal [0,5 ; 0,42] des écrins ronds.
    var FX = 800, FY = 378, FR = 378;
    var disc = 'M' + (FX - FR) + ' ' + FY + 'a' + FR + ' ' + FR + ' 0 1 0 ' + 2 * FR + ' 0a' + FR + ' ' + FR + ' 0 1 0 ' + -2 * FR + ' 0Z';
    function roundCrop() {
      return h('svg', { viewBox: '0 0 1600 900', 'aria-hidden': 'true', style: { position: 'absolute', inset: 0, width: '100%', height: '100%' } },
        h('path', { d: 'M0 0H1600V900H0Z' + disc, fillRule: 'evenodd', style: { fill: 'var(--gc-paper)', opacity: 0.62 } }),
        h('path', { d: disc, fill: 'none', strokeWidth: 5, strokeDasharray: '14 12', strokeLinecap: 'round', style: { stroke: 'var(--gc-ink)' } }));
    }
    function panel(caption, props, overlay) {
      return h('figure', { style: { margin: 0, width: 640, display: 'flex', flexDirection: 'column' } },
        h('div', { style: { position: 'relative', width: 640, height: 360, borderRadius: 'var(--gc-radius-photo)', overflow: 'hidden', boxShadow: 'var(--gc-sh-lift)' } },
          h(SceneVideo, props),
          overlay ? overlay() : null),
        h('figcaption', { className: 'gc-hand-caption', style: { color: 'var(--gc-chocolate)', textAlign: 'center' } }, caption));
    }
    ReactDOM.createRoot(document.getElementById('root')).render(
      h('div', { style: { display: 'flex', gap: 15, padding: '4px 15px 0', background: 'var(--gc-paper)', width: 1980, height: 420, boxSizing: 'border-box' } },
        panel('Avant lecture · aquarelle douce', { scene: 'julie', look: 'aquarelle', state: 'idle' }),
        panel('Avant lecture · sépia crayonné', { scene: 'julie', look: 'sepia', state: 'idle' }),
        panel('En lecture · cadrage rond', { scene: 'julie', state: 'playing' }, roundCrop)));
  })();
</script>
