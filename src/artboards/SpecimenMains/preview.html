<!-- @dsCard group="Spécimen" width=1920 height=1080 page subtitle="Les sept mains du carnet : un ingrédient au cran proche et au cran loin, une rature corrigée, une annotation et les glyphes difficiles, chacune dans son encre" -->
<style>
  .sp {
    box-sizing: border-box;
    width: 1920px;
    height: 1080px;
    padding: var(--gc-space-5) var(--gc-space-5) var(--gc-space-5);
    display: flex;
    flex-direction: column;
    gap: var(--gc-space-4);
    background:
      radial-gradient(90% 80% at 0% 0%, var(--gc-paper-lit), transparent 60%),
      radial-gradient(70% 60% at 100% 100%, color-mix(in srgb, var(--gc-paper-aged) 55%, transparent), transparent 70%),
      var(--gc-paper);
  }
  .sp-tete {
    display: flex;
    align-items: baseline;
    gap: var(--gc-space-7);
  }
  .sp-tete > .gc-titremain { flex: none; }
  .sp-tete__sous { flex: 1 1 auto; }
  .sp-grille {
    display: grid;
    grid-template-columns: 380px 380px 345px 290px 200px minmax(0, 1fr);
    grid-template-rows: auto repeat(7, auto);
    column-gap: var(--gc-space-2);
    align-items: baseline;
  }
  /* La colonne « cran loin » est un conteneur à part (data-gc-distance="loin") qui partage
     les rangées de la grille (sous-grille). */
  .sp-loin {
    grid-column: 3;
    grid-row: 1 / span 8;
    display: grid;
    grid-template-rows: subgrid;
    align-items: baseline;
    padding-inline: var(--gc-space-3);
    margin-inline: calc(-1 * var(--gc-space-3));
    background: color-mix(in srgb, var(--gc-paper-aged) 45%, transparent);
    border-radius: var(--gc-radius-paper);
  }
  .sp-cell {
    padding-block: var(--gc-space-1) var(--gc-space-2);
    border-block-end: 1.5px solid color-mix(in srgb, var(--gc-ink-crayon) 14%, transparent);
    min-width: 0;
  }
  .sp-entete { border-block-end: 0; padding-block-end: var(--gc-space-1); white-space: nowrap; }
  .sp-note { padding-inline-start: var(--gc-space-6); }
  .sp-qui {
    display: flex;
    align-items: baseline;
    gap: var(--gc-space-2);
  }
  .sp-titres {
    display: flex;
    align-items: baseline;
    gap: var(--gc-space-7);
    padding-block-start: var(--gc-space-3);
  }
  .sp-titres > .gc-titremain { flex: none; }
  .sp-encres {
    margin-block-start: auto;
    display: flex;
    align-items: baseline;
    gap: var(--gc-space-6);
  }
  .sp-encre { display: inline-flex; }
</style>
<div id="root"></div>
<script>
  (function () {
    var h = React.createElement;
    var G = GoutersDeCecile;
    ['Kalam', 'Caveat', 'Playwrite FR Trad', 'Playwrite FR Moderne', 'Shantell Sans', 'Patrick Hand SC', 'La Belle Aurore'].forEach(function (f) {
      document.fonts.load('400 40px "' + f + '"'); document.fonts.load('700 40px "' + f + '"');
    });

    var MAINS = [
      { hand: 'mamie', name: 'Rose', ink: 'brune', label: 'mamie · brune', note: 'parfait', seed: 11 },
      { hand: 'ecole', name: 'Léa', ink: 'plume', label: 'école · plume', note: 'trop bon !', seed: 23 },
      { hand: 'soignee', name: 'Julie', ink: 'bic', label: 'soignée · bic', note: 'moins sucré', noteInk: 'rouge', seed: 37 },
      { hand: 'feutre', name: 'Mathis', ink: 'feutre', label: 'feutre · violet', note: 'miam !!', seed: 41 },
      { hand: 'capitales', name: 'Bernard', ink: 'noire', label: 'capitales · noire', note: 'vérifié', seed: 53 },
      { hand: 'pressee', name: 'Antoine', ink: 'bic', label: 'pressée · bic', note: 'à tester', seed: 67 },
      { hand: 'cecile', name: 'Cécile', ink: undefined, label: 'cecile · chocolat', note: 'goûté !', seed: 79 },
    ];
    var E = function (props, text) { return h(G.Ecriture, props, text); };
    var legende = function (key, text, extra) {
      return E(Object.assign({ key: key, hand: 'cecile', ink: 'crayon', role: 'meta', as: 'span', grain: true }, extra || {}), text);
    };

    // Rangée d'en-têtes (la colonne « loin » a la sienne dans son conteneur)
    var cells = [
      h('div', { key: 'h1', className: 'sp-cell sp-entete' }, legende('l', 'qui · main · encre')),
      h('div', { key: 'h2', className: 'sp-cell sp-entete' }, legende('l', 'cran proche')),
      h('div', { key: 'h4', className: 'sp-cell sp-entete' }, legende('l', 'une rature')),
      h('div', { key: 'h5', className: 'sp-cell sp-entete' }, legende('l', 'annotation')),
      h('div', { key: 'h6', className: 'sp-cell sp-entete' }, legende('l', 'les glyphes')),
    ];
    var loin = [h('div', { key: 'lh', className: 'sp-cell sp-entete' }, legende('l', 'cran loin'))];

    MAINS.forEach(function (m, i) {
      var base = { hand: m.hand, ink: m.ink, seed: m.seed };
      var slant = [-0.6, -0.3, -0.8, 0.3, -0.4, -1.2, -0.5][i];
      cells.push(
        h('div', { key: 'q' + i, className: 'sp-cell sp-qui' },
          E(Object.assign({}, base, { role: 'signature', as: 'span', slant: -2 }), m.name),
          legende('l', m.label)),
        h('div', { key: 'p' + i, className: 'sp-cell' },
          E(Object.assign({}, base, { role: 'body', slant: slant, seed: m.seed + 1 }), '2 citrons non traités')),
        h('div', { key: 'r' + i, className: 'sp-cell' },
          E(Object.assign({}, base, { role: 'body', slant: slant, seed: m.seed + 2 }), '~~150 g~~>120 g de sucre')),
        h('div', { key: 'a' + i, className: 'sp-cell sp-note' },
          h(G.Annotation, { text: m.note, hand: m.hand, ink: m.noteInk || m.ink, arrow: i % 2 ? 'droite' : 'courbe', tilt: [-6, 4, -3, 7, -2, -8, 5][i], to: { x: -30, y: [8, -6, 10, -4, 6, 12, -8][i] }, seed: m.seed + 3 })),
        h('div', { key: 'g' + i, className: 'sp-cell' },
          E(Object.assign({}, base, { role: 'body', seed: m.seed + 4 }), 'œ « » ’ ° ½')));
      loin.push(
        h('div', { key: 'l' + i, className: 'sp-cell' },
          E(Object.assign({}, base, { role: 'body', slant: slant, seed: m.seed + 1 }), '2 citrons non traités')));
    });

    var ENCRES = ['plume', 'bic', 'crayon', 'brune', 'noire', 'feutre', 'rouge'];

    ReactDOM.createRoot(document.getElementById('root')).render(
      h('main', { className: 'sp', 'data-gc-distance': 'proche' },
        h('header', { className: 'sp-tete' },
          h(G.TitreMain, { hand: 'cecile', underline: 'vague', underlineInk: 'rouge', seed: 5, slant: -0.8, as: 'h2' }, 'Les mains du carnet'),
          E({ className: 'sp-tete__sous', hand: 'cecile', ink: 'crayon', role: 'note', seed: 6, slant: -0.4 },
            'chacun écrit de sa main, dans son encre · même hauteur d’x pour toutes')),
        h('section', { className: 'sp-grille' },
          h('div', { className: 'sp-loin', 'data-gc-distance': 'loin' }, loin),
          cells),
        h('section', { className: 'sp-titres' },
          legende('t', 'les titres :', { role: 'note' }),
          h(G.TitreMain, { hand: 'soignee', ink: 'bic', underline: 'regle', underlineInk: 'rouge', seed: 201, slant: -0.6 }, 'Le cake de Julie'),
          h(G.TitreMain, { hand: 'mamie', ink: 'brune', underline: 'double', seed: 202, slant: -0.4 }, 'Tarte de Rose'),
          h(G.TitreMain, { hand: 'feutre', ink: 'feutre', underline: 'vague', seed: 203, slant: 0.3 }, 'Cookies !'),
          h(G.TitreMain, { hand: 'capitales', ink: 'rouge', underline: 'aucun', seed: 204, slant: -0.3 }, 'Crêpes')),
        h('footer', { className: 'sp-encres' },
          legende('t', 'les encres :', { role: 'note' }),
          ENCRES.map(function (k, i) {
            return h('span', { key: k, className: 'sp-encre' },
              h(G.Ecriture, { hand: 'soignee', ink: k, role: 'body', as: 'span', seed: 90 + i, souligne: k === 'rouge' ? 'double' : 'regle' }, k));
          }),
          legende('n', 'le rouge : corrections, soulignés, titres', { role: 'note' }))));
  })();
</script>
