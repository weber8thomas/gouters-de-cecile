<!-- @dsCard group="Planche comparative" width=1920 height=1080 page subtitle="La même page vidéo : Cormorant ou Playfair, table en bois ou nappe" -->
<div id="root"></div>
<script>
  const h = React.createElement;
  const { Artboards } = GoutersDeCecile;
  const S = 0.45; // vignettes de 864×486 sous une bande de titre de 54 px
  const cells = [
    { serif: 'cormorant', table: 'bois', label: 'Cormorant Garamond · table en bois' },
    { serif: 'cormorant', table: 'nappe', label: 'Cormorant Garamond · nappe' },
    { serif: 'playfair', table: 'bois', label: 'Playfair Display · table en bois' },
    { serif: 'playfair', table: 'nappe', label: 'Playfair Display · nappe' },
  ];
  const cell = (c) => h('figure', { key: c.label, style: { margin: 0, display: 'flex', flexDirection: 'column' } },
    h('figcaption', { className: 'gc-hand-caption', style: { height: 54, lineHeight: '54px', color: 'var(--gc-paper)', whiteSpace: 'nowrap' } }, c.label),
    h('div', { style: { width: 1920 * S, height: 1080 * S, overflow: 'hidden', boxShadow: 'var(--gc-sh-object)' } },
      h('div', { style: { width: 1920, height: 1080, transform: `scale(${S})`, transformOrigin: '0 0' } },
        h(Artboards.PageVideo, { serif: c.serif, table: c.table, state: 'idle' }))));
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { style: { display: 'grid', gridTemplateColumns: `${1920 * S}px ${1920 * S}px`, columnGap: 64, justifyContent: 'center', alignContent: 'center', width: 1920, height: 1080, background: 'var(--gc-wood-3)' } }, cells.map(cell)));
</script>
