# Conserve le carnet et les essais sur gh-pages, puis déploie exactement ce commit sur Pages.
# Une seule fois : Settings → Pages → Build and deployment → Source « GitHub Actions ».
# configure-pages ne convertit pas automatiquement une source « Deploy from a branch » existante.
# Si l'environnement github-pages restreint les branches autorisées, y autoriser main.
name: Carnet sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lire la configuration Pages existante
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build:site
      - name: Vérifier la publication sans toucher au dépôt distant
        run: node --test scripts/tests/publish-pages.test.mjs
      - name: Publier dist/site sur la branche gh-pages
        id: publication
        # Réutilise l'authentification installée par actions/checkout ; aucun jeton dans l'URL.
        # Conserve l'historique gh-pages et tous les essais déjà publiés.
        run: node scripts/publish-pages.mjs
      - name: Préparer le site complet publié, essais inclus
        shell: bash
        env:
          PAGES_COMMIT: ${{ steps.publication.outputs.commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/carnet-pages"
          git archive "$PAGES_COMMIT" | tar -x -C "$RUNNER_TEMP/carnet-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/carnet-pages
      - name: Déployer le site sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
